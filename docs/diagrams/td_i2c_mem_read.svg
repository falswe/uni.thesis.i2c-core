<line x1="252" y1="252" x2="278" y2="252" stroke="#9aa0a6" stroke-width="3" stroke-linecap="round"/>
<text x="286" y="256" font-size="12" fill="#202124" text-anchor="start">Nobody (bus idle, pull-up holds the line high)</text>
<text x="16" y="274" font-size="11" fill="#5f6368" text-anchor="start">Open-drain: devices only pull lines low; high = released, pulled up by the resistor. Colour = device that controls the line, so a 1 bit or NACK is a released line owned by its sender.</text>
<text x="16" y="292" font-size="11" fill="#5f6368" text-anchor="start">No-stop write selects the register offset; repeated START (Sr) turns the bus around for the read; STOP only at the end.</text>
<text x="16" y="310" font-size="11" fill="#5f6368" text-anchor="start">Clock stretch is optional and may occur in any SCL low phase: the target holds SCL low until it is ready, the controller waits for SCL to rise.</text>
