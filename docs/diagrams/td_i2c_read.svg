<line x1="16" y1="252" x2="42" y2="252" stroke="#1f6fd1" stroke-width="3" stroke-linecap="round"/>
<text x="50" y="256" font-size="12" fill="#202124" text-anchor="start">Controller</text>
<line x1="148" y1="252" x2="174" y2="252" stroke="#e8710a" stroke-width="3" stroke-linecap="round"/>
<text x="182" y="256" font-size="12" fill="#202124" text-anchor="start">Target</text>
<line x1="252" y1="252" x2="278" y2="252" stroke="#9aa0a6" stroke-width="3" stroke-linecap="round"/>
<text x="286" y="256" font-size="12" fill="#202124" text-anchor="start">Nobody (bus idle, pull-up holds the line high)</text>
<text x="16" y="274" font-size="11" fill="#5f6368" text-anchor="start">Open-drain: devices only pull lines low; high = released, pulled up by the resistor. Colour = device that controls the line, so a 1 bit or NACK is a released line owned by its sender.</text>
<text x="16" y="292" font-size="11" fill="#5f6368" text-anchor="start">Target sends every data byte after its address ACK; controller ACKs each byte except the last, which it NACKs before STOP.</text>
<text x="16" y="310" font-size="11" fill="#5f6368" text-anchor="start">Here the target stretches after its address ACK until its first data byte is ready; it can also stretch before any later byte.</text>
<text x="16" y="328" font-size="11" fill="#5f6368" text-anchor="start">Clock stretch is optional and may occur in any SCL low phase: the target holds SCL low until it is ready, the controller waits for SCL to rise.</text>
